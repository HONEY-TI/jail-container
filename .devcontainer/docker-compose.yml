#docker run --rm -it --entrypoint /bin/bash jail-devcontainer:latest

services:
  jail-devcontainer:
    container_name: jail-devcontainer
    image: jail-devcontainer:latest
    tty: true
    stdin_open: true
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: node
        WORKSPACE: /workspace
    working_dir: /workspace
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      XAUTHORITY: /tmp/.xauth-devc
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN não definido no .env}
    env_file:
      - .env
    volumes:
      - ../:/workspace:cached
      - vscode-extensions-jail:/home/node/.vscode-server/extensions
      - node_modules:/workspaces/node_modules
      - angular_cache:/workspaces/.angular
      - py_tmp:/tmp
      - pip_cache:/home/node/.cache/pip
    ports:
      - "9876:9876"
      - "5000:5000"
      - "4200:4200"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    command: sleep infinity
    shm_size: "2g"
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  vscode-extensions-jail:
  node_modules:
  angular_cache:
  py_tmp:
  pip_cache:
